# Jekyll Configuration - Huayu Capacitor Website
title: "HUAYU Capacitor"
description: "Professional aluminum electrolytic capacitor manufacturer since 1987, specializing in custom snap-in and screw terminal capacitors for industrial applications."
url: "https://capacitormanufacturer.com"
baseurl: ""
permalink: /blog/:title/
future: true

# Company Info (flat structure for Liquid safety)
company_name: "Nantong Huayu Electronics Co., Ltd."
company_name_short: "HUAYU"
company_email: "zuwho@hotmail.com"
company_tel: "+86-513-86310599"
company_mobile: "+86-18912241508"
company_address: "No. 60 Zhangchuan Road, Zhangzhishan Town, Tongzhou District, Nantong, Jiangsu, China"
company_address_zip: "226311"
company_founded: "1987"
company_website: "https://capacitormanufacturer.com"

# SEO - Analytics & Webmaster Tools
# After verifying in each console, paste the token/ID below (used by _layouts/default.html)
google_analytics: "G-M81Y7D58V6"     # GA4 measurement ID, e.g. G-XXXXXXXXXX
google_verification: ""              # Google Search Console meta content value
bing_verification: ""                # Bing Webmaster Tools msvalidate.01 content value
baidu_site_verification: ""          # Baidu webmaster verification content

# Site Social (Open Graph / Twitter Card)
twitter_username: ""                 # e.g. "HuayuCapacitor"
facebook_app_id: ""                  # For better Facebook/LinkedIn sharing
default_image: "/assets/images/huayu.jpg"

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
  - .workbuddy
  - website-improvement-plan.md
  - blog/index.md
